<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه آنلاین مدرن | محصولات</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">فروشگاه<span>مدرن</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="">صفحه اصلی</a></li>
        <li><a href="products.html" class="active">محصولات</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn">
          <span>سبد خرید</span>
          <span class="cart-count" id="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>


  <div class="layout-container">
    <aside class="sidebar">
      <input type="text" id="search-input" class="search-bar" placeholder="جستجوی محصول...">
      
      <div class="filter-group">
        <div class="filter-title">دسته‌بندی‌ها</div>
        <ul class="filter-list">
          <li class="category-filter active" data-category="all">همه دسته‌ها</li>
          <li class="category-filter" data-category="electronics">دیجیتال و الکترونیک</li>
          <li class="category-filter" data-category="fashion">مد و پوشاک</li>
          <li class="category-filter" data-category="books">کتاب و ادبیات</li>
          <li class="category-filter" data-category="home">خانه و زندگی</li>
        </ul>
      </div>
    </aside>

    <main>
      <div class="products-grid" id="products-catalog"></div>
    </main>
  </div>

  
  <footer>
    <div style="max-width:1200px; margin:0 auto;">
      <p>© ۱۴۰۳ تمامی حقوق برای فروشگاه آنلاین مدرن محفوظ است.</p>
      <p style="font-size:0.85rem; margin-top:0.5rem;">طراحی شده با استانداردهای مدرن وب و تم تیره اختصاصی.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initProductsPage);
  </script>
</body>
</html>
