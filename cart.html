<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه آنلاین مدرن | سبد خرید</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">فروشگاه<span>مدرن</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="">صفحه اصلی</a></li>
        <li><a href="products.html" class="">محصولات</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn">
          <span>سبد خرید</span>
          <span class="cart-count" id="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>


  <section class="section">
    <div class="section-title">
      <h2>سبد خرید <span>شما</span></h2>
    </div>
    
    <div class="cart-container">
      <div class="cart-items" id="cart-items-list">
        <!-- Cart items rendered here -->
      </div>
      
      <div class="cart-summary">
        <h3 style="margin-bottom:1.5rem; color:var(--accent-cyan);">خلاصه فاکتور</h3>
        <div class="summary-row">
          <span>تعداد کل اقلام:</span>
          <span id="cart-total-items">0</span>
        </div>
        <div class="summary-row">
          <span>هزینه ارسال:</span>
          <span>رایگان</span>
        </div>
        <div class="summary-row total">
          <span>مبلغ نهایی:</span>
          <span id="cart-total-price">۰ تومان</span>
        </div>
        <button class="btn btn-primary" style="width:100%; margin-top:1.5rem;" onclick="alert('سفارش شما با موفقیت ثبت شد!')">تکمیل فرایند خرید</button>
      </div>
    </div>
  </section>

  
  <footer>
    <div style="max-width:1200px; margin:0 auto;">
      <p>© ۱۴۰۳ تمامی حقوق برای فروشگاه آنلاین مدرن محفوظ است.</p>
      <p style="font-size:0.85rem; margin-top:0.5rem;">طراحی شده با استانداردهای مدرن وب و تم تیره اختصاصی.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCartPage);
  </script>
</body>
</html>
